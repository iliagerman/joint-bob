<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discoverable assistants and groups · Joint Bob design preview</title>
<style>
/* Tokens copied from the dark theme in public/styles.css. */
:root{color-scheme:dark;--bg:#08090b;--panel:#101215;--header:#171a1e;--surface:#191c20;--field:#212529;--line:rgba(255,255,255,.075);--line-strong:rgba(255,255,255,.17);--text:#ebeced;--muted:#94999e;--btn-bg:#24272b;--btn-border:rgba(255,255,255,.13);--btn-hover:#2c3035;--accent:#37cfab;--live:#3cb474;--amber:#d0a63c;--danger:#e0564e;--heading:#f1f4f3;--heading-soft:#7fdcc6;--ctl:10px;--card:12px;--sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",sans-serif;--serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;font-family:var(--sans)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
h1,h2,h3,p,ol,ul,dl,dd,blockquote{margin:0;padding:0}
ol,ul{list-style:none}
[hidden]{display:none!important}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
small,.muted{color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:7px 13px;font-size:13px;background:var(--btn-bg);border:1px solid var(--btn-border);border-radius:var(--ctl)}
button:hover:not(:disabled){background:var(--btn-hover)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#07241c;font-weight:600}
button.primary:hover:not(:disabled){background:#4ad9b7}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover:not(:disabled){background:var(--surface)}
button.danger{color:#ffb3ad;border-color:color-mix(in srgb,var(--danger) 45%,transparent);background:transparent}
button.icon{width:38px;padding:0;flex-shrink:0}
button.link{min-height:0;padding:0;background:none;border:0;color:var(--heading-soft);font-size:inherit}
button.link:hover:not(:disabled){background:none;text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{width:100%;min-height:40px;padding:9px 11px;background:var(--field);border:1px solid var(--line-strong);border-radius:var(--ctl);font-size:14px}
textarea{resize:vertical;line-height:1.5}
label.field{display:grid;gap:6px;font-size:12.5px;color:#c9cdd1;margin-bottom:16px}
label.field small{font-size:12px;line-height:1.5}

/* Review page around the device. */
.page{max-width:1400px;margin:auto;padding:26px 32px 28px}
.eyebrow{font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--heading-soft)}
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-top:8px}
.intro h1{font:400 32px/1.15 var(--serif);letter-spacing:-.02em;color:var(--heading)}
.intro p{color:var(--muted);font-size:13px;margin-top:6px;max-width:680px}
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--panel);border:1px solid var(--line-strong);border-radius:11px;flex-shrink:0}
.seg button{min-height:32px;padding:4px 13px;background:transparent;border:0;color:var(--muted);border-radius:8px}
.seg button[aria-pressed=true]{background:var(--btn-hover);color:var(--text)}
.review{margin:16px 0 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.review>span{font:11px var(--mono);color:var(--muted);margin-right:6px}
.review button{min-height:32px;padding:3px 12px;border-radius:20px;background:transparent;font-size:12.5px}
.review button[aria-pressed=true]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
#jump-note{min-height:20px;margin:0 0 14px;font-size:13px;color:#c9cdd1}
.stage{display:flex;justify-content:center}

/* Device frame and app shell. */
.device{position:relative;width:100%;max-width:1320px;height:800px;display:flex;flex-direction:column;overflow:hidden;background:var(--panel);border:1px solid var(--line-strong);border-radius:16px;box-shadow:0 20px 56px rgba(0,0,0,.55)}
.device.mobile{width:390px;height:min(844px,calc(100dvh - 24px));border-width:5px;border-radius:34px}
#shell{flex:1;min-height:0;display:flex}
.device.mobile #shell{flex-direction:column}
.m-status{height:36px;padding:10px 24px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:600;flex-shrink:0}
.m-home{width:115px;height:4px;border-radius:4px;background:#8b9197;margin:8px auto;flex-shrink:0}
.m-body{flex:1;min-height:0;display:flex;flex-direction:column}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--header);flex-shrink:0}
.tabbar button{position:relative;flex-direction:column;gap:2px;min-height:54px;padding:6px 2px;font-size:11px;color:var(--muted);background:transparent;border:0;border-radius:0}
.tabbar button[aria-current=page]{color:var(--accent)}
.tabbar .badge{position:absolute;top:4px;left:calc(50% + 6px)}
.rail{width:272px;flex-shrink:0;padding:14px 10px 10px;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);overflow:auto}
.brand{display:flex;align-items:center;gap:8px;padding:0 6px 12px;font-weight:650;letter-spacing:-.03em}
.brand a{margin-left:auto;font-size:12px;font-weight:400;letter-spacing:0;color:var(--heading-soft);text-decoration:none}
.brand-mark{width:26px;height:26px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:8px;color:var(--accent);font:italic 15px var(--serif)}
.rail-search{width:100%;justify-content:flex-start;color:var(--muted);background:var(--field);border-color:var(--line);margin-bottom:6px}
.sec{display:flex;align-items:center;justify-content:space-between;min-height:30px;margin:12px 6px 3px;font:11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sec button{width:28px;min-height:28px;padding:0}
.sec svg{width:15px;height:15px}
.row{width:100%;min-height:50px;padding:6px 8px;justify-content:flex-start;gap:10px;text-align:left;background:transparent;border-color:transparent}
.row[aria-current=true]{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.row-text{flex:1;min-width:0}
.row-text strong{display:flex;gap:6px;align-items:center;font-size:13.5px;font-weight:550}
.row-text strong span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row-text small{display:block;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rail-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:11px;padding:12px 20px;min-height:66px;background:var(--header);border-bottom:1px solid var(--line);flex-shrink:0}
.head-text{flex:1;min-width:0}
.head h2{font:400 22px/1.2 var(--serif);letter-spacing:-.015em;color:var(--heading);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.head p{font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.head-actions{display:flex;gap:6px;flex-shrink:0}
.tabs{display:flex;gap:2px;padding:6px 16px 0;background:var(--header);border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0}
.tabs button{min-height:38px;padding:6px 11px;background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
.tabs button:hover:not(:disabled){background:transparent;color:var(--text)}
.scroll{flex:1;min-height:0;overflow:auto}
.narrow{max-width:800px;margin:0 auto;padding:22px 24px 30px}
.page-title{font:400 25px/1.2 var(--serif);color:var(--heading);padding:6px 16px 10px}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 4px 0}

/* Identity. People are circles, assistants are rounded squares. */
.av{width:30px;height:30px;display:grid;place-items:center;flex-shrink:0;border-radius:50%;background:#2c3035;font:600 10.5px var(--mono);color:#c9cdd1}
.av.you{background:color-mix(in srgb,var(--accent) 22%,#20252a);color:var(--heading-soft)}
.av.ghost{background:transparent;border:1.5px dashed var(--line-strong);color:var(--muted)}
.bot{width:30px;height:30px;display:grid;place-items:center;flex-shrink:0;border-radius:9px;background:color-mix(in srgb,var(--accent) 16%,#1b2023);color:var(--accent)}
.bot svg{width:17px;height:17px}
.bot.mine-b{color:#9ec3e6;background:#1e2a35}
.bot.mine-c{color:#d9bd7c;background:#2f2a1e}
.bot.other{color:#c9cdd1;background:#2a2e33}
.badge{min-width:18px;height:18px;padding:0 5px;display:inline-grid;place-items:center;border-radius:9px;background:var(--amber);color:#241b02;font:600 10.5px var(--mono);flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;font:10.5px/1.5 var(--mono);white-space:nowrap;color:var(--muted);border:1px solid var(--line-strong);border-radius:6px}
.chip.amber{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent);background:color-mix(in srgb,var(--amber) 10%,transparent)}
.chip.ok{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.chip.bad{color:#ff9d95;border-color:color-mix(in srgb,var(--danger) 50%,transparent);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}

/* Chat. */
.msgs{max-width:780px;margin:0 auto;padding:20px 24px 12px;display:flex;flex-direction:column;gap:14px}
.sys{text-align:center;color:var(--muted);font-size:12px;line-height:1.55}
.m{display:flex;gap:10px;align-items:flex-start;max-width:88%}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.who{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted);margin-bottom:3px}
.who b{color:var(--text);font-weight:600}
.bubble{padding:8px 13px;border-radius:13px;background:var(--surface);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.m.me .bubble{background:color-mix(in srgb,var(--accent) 15%,var(--surface));border-color:color-mix(in srgb,var(--accent) 28%,transparent)}
.m.bot-msg .bubble{border-left:2px solid var(--accent)}
.send-state{font-size:11px;color:var(--muted);margin-top:3px;text-align:right}
.composer-wrap{padding:8px 20px 14px;flex-shrink:0}
.composer{max-width:780px;margin:0 auto;padding:9px 10px 8px;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px}
.composer textarea{min-height:28px;padding:2px 4px;background:transparent;border:0;resize:none;outline:0}
.composer-foot{display:flex;align-items:center;gap:6px;margin-top:3px;color:var(--muted);font-size:12px}
.composer-foot .spacer{flex:1;min-width:0}
.composer-foot button:not(.primary){min-height:30px;padding:2px 9px;font-size:12px;background:transparent}
.composer-foot button.primary{width:34px;min-height:34px}
.strip{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13px;flex-shrink:0;background:color-mix(in srgb,var(--amber) 9%,var(--panel));border-bottom:1px solid color-mix(in srgb,var(--amber) 30%,transparent)}
.strip>span{flex:1;min-width:0}
.strip button{min-height:32px;padding:3px 12px}
.strip.info{background:var(--surface);border-bottom-color:var(--line)}
.strip.warn svg{color:var(--amber)}

/* Decision trail. Shows where a request is, never a generated reason. */
.trail{display:flex;flex-wrap:wrap;gap:3px 0;font-size:11.5px;color:var(--muted)}
.trail li{display:flex;align-items:center;gap:5px}
.trail li+li::before{content:"";width:9px;height:1px;margin:0 4px;background:var(--line-strong)}
.trail i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line-strong)}
.trail .done{color:#c9cdd1}
.trail .done i{background:var(--accent);border-color:var(--accent)}
.trail .now{color:var(--amber);font-weight:600}
.trail .now i{background:var(--amber);border-color:var(--amber);animation:pulse 1.6s infinite}
.trail .stop{color:#ff9d95;font-weight:600}
.trail .stop i{background:var(--danger);border-color:var(--danger)}
@keyframes pulse{50%{opacity:.35}}
.m-trail{align-self:flex-start;margin-left:0;padding:0 2px}

/* Member list: the line shows whose assistant is whose. */
.split{flex:1;min-height:0;display:flex}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.members{width:316px;flex-shrink:0;overflow:auto;padding:14px 16px;border-left:1px solid var(--line);background:var(--panel)}
.tree-person{display:flex;gap:10px;align-items:center;min-height:44px}
.tree-bot{position:relative;display:flex;gap:10px;align-items:center;min-height:50px;margin-left:15px;padding-left:25px}
.tree-bot::before{content:"";position:absolute;left:0;top:-7px;height:calc(50% + 7px);width:19px;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);border-bottom-left-radius:9px}
.tree-bot.alone::before{border-left:2px dashed var(--muted);border-bottom:2px dashed var(--muted);border-radius:0}
.tree-text{flex:1;min-width:0}
.tree-text b{display:block;font-size:13.5px;font-weight:550}
.tree-text small{display:block;font-size:12px;line-height:1.4}
.watch{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--live)}
.watch::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.watch.pending{color:var(--amber)}
.tree-remove{min-height:28px;padding:1px 8px;font-size:12px;color:var(--muted)}
.fine{font-size:12px;line-height:1.55;color:var(--muted)}
.members-foot{display:grid;gap:7px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.members-foot button{width:100%}

/* Cards, lists and panels. */
.card{padding:15px 16px;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--card)}
.card h3{font-size:15px;font-weight:600}
.card.attention{border-color:color-mix(in srgb,var(--amber) 42%,transparent)}
.card.done{border-color:color-mix(in srgb,var(--accent) 38%,transparent)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.card p+p,.card .gap{margin-top:9px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.actions .grow{flex:1}
.quote{padding:7px 11px;margin-top:10px;font-size:13px;color:#c9cdd1;border-left:2px solid var(--line-strong)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:10px;padding:10px 12px;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:9px}
.kv dt{color:var(--muted)}
.exact{margin-top:10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:9px}
.label{font-size:12px;color:var(--muted);margin-bottom:4px}
.work{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.work>div{flex:1;min-width:0}
.work strong{font-weight:550;font-size:13.5px;display:block}
.work small{display:block;font-size:12.5px;line-height:1.5}
.work .chip{flex-shrink:0;margin-top:1px}
.work-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.work-actions button{min-height:30px;padding:2px 10px;font-size:12px}
.settings-sec{margin-bottom:28px}
.settings-sec h3{font:400 19px var(--serif);color:var(--heading);margin-bottom:4px}
.settings-sec>p{font-size:13px;color:var(--muted);margin-bottom:12px}
.radio{display:flex;gap:11px;align-items:center;width:100%;min-height:50px;padding:7px 12px;margin-bottom:6px;justify-content:flex-start;text-align:left;background:var(--surface);border-color:var(--line)}
.radio[aria-checked=true]{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.radio .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-strong);flex-shrink:0}
.radio[aria-checked=true] .dot{border:5px solid var(--accent)}
table.matrix{width:100%;border-collapse:collapse;font-size:13.5px}
.matrix th,.matrix td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center;font-weight:500}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix th{font-size:12px;color:var(--muted)}
.switch{position:relative;width:38px;min-height:22px;height:22px;padding:0;border-radius:11px;background:var(--field);border:1px solid var(--line-strong)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:left .12s}
.switch[aria-checked=true]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked=true]::after{left:18px;background:#07241c}
.switch:hover:not(:disabled)[aria-checked=true]{background:var(--accent)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.listing{display:flex;gap:11px;align-items:flex-start}
.never{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.result{display:flex;gap:11px;align-items:center;width:100%;min-height:66px;padding:10px 12px;margin-bottom:7px;justify-content:flex-start;text-align:left;background:var(--surface);border-color:var(--line)}
.result .row-text small{white-space:normal}
.result-routes{margin-top:5px}
.search{position:relative;margin-bottom:8px}
.search svg{position:absolute;left:12px;top:12px;color:var(--muted)}
.search input{padding-left:38px;min-height:44px;font-size:15px}
.find-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0 12px}
.notice{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;margin-bottom:12px;font-size:13px;background:color-mix(in srgb,var(--amber) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--amber) 32%,transparent);border-radius:10px}
.notice svg{color:var(--amber);margin-top:1px}
.notice>span{flex:1}
.notice.plain{background:var(--surface);border-color:var(--line)}
.notice.plain svg{color:var(--muted)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13.5px}
.catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-top:9px}
.catalog button{display:block;height:auto;padding:9px 12px;text-align:left;background:var(--surface);border-color:var(--line)}
.catalog strong{display:block;font-weight:550}
.catalog small{display:block;font-size:12px;line-height:1.45;margin-top:2px}
.actions-layout{flex:1;min-height:0;display:flex}
.action-list{width:280px;flex-shrink:0;padding:14px 12px;overflow:auto;border-right:1px solid var(--line)}
.action-item{display:block;width:100%;height:auto;padding:10px 11px;margin-bottom:6px;text-align:left;background:transparent;border-color:var(--line)}
.action-item[aria-current=true]{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.action-item strong{display:block;font-weight:550;margin-bottom:5px}
.op{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:13.5px}
.op input{width:16px;min-height:16px;height:16px;margin:2px 0 0;accent-color:var(--accent);flex-shrink:0}
.op small{display:block;font-size:12px}
.group-label{font-size:12.5px;color:#c9cdd1;margin:10px 0 2px}
.editor-box{padding:13px 14px;margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--card)}
.editor-box label.field:last-child{margin-bottom:0}
.private-tag{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--amber)}
.private-tag svg{width:13px;height:13px}

/* Resources: lists fit the height and page instead of scrolling. */
.res-layout{flex:1;min-height:0;display:flex}
.res-nav{width:280px;flex-shrink:0;padding:14px 12px;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.res-item strong{display:flex;align-items:center;gap:8px}
.res-item svg{width:16px;height:16px;color:var(--muted)}
.res-item small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-nav-foot{margin-top:auto;padding-top:12px;display:grid;gap:8px}
.res-detail{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;padding:18px 24px 14px}
.res-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}

.res-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;margin-bottom:6px;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.res-list{flex:1;min-height:0;overflow:hidden}
.res-row{display:flex;align-items:center;gap:11px;height:58px;padding:0 4px;border-bottom:1px solid var(--line)}
.res-row.off .row-text,.res-row.off .site{opacity:.5}
.res-ctl{display:flex;align-items:center;gap:6px;flex-shrink:0}
.res-row button:not(.switch),.work .site+div+button{min-height:32px;padding:3px 11px;font-size:12.5px}
.site{width:30px;height:30px;display:grid;place-items:center;flex-shrink:0;border-radius:8px;background:#2a2e33;font:600 12px var(--mono);color:#c9cdd1}
.site svg{width:16px;height:16px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;font-size:12px;color:var(--muted)}
.pager span{display:flex;gap:6px}
.pager button{min-height:30px;padding:2px 10px;font-size:12px}
.viewer{margin:12px 0;overflow:hidden;border:1px solid var(--line-strong);border-radius:12px}
.viewer-bar{display:flex;align-items:center;gap:8px;padding:7px 10px;font:11.5px var(--mono);color:var(--muted);background:var(--header)}
.viewer-bar svg{width:13px;height:13px}
.viewer-bar .chip{margin-left:auto}
.viewer-body{min-height:210px;display:grid;place-items:center;align-content:center;gap:10px;padding:18px;background:#f3f4f1;color:#1b1e20}
.qr{display:grid;grid-template-columns:repeat(21,6px);grid-auto-rows:6px;padding:8px;background:#fff}
.qr i.on{background:#111}
.fake-login{width:220px;display:grid;gap:8px}
.fake-login span{height:30px;background:#fff;border:1px solid #c9ccc6;border-radius:6px}
.fake-login b{height:30px;background:#2b5ea7;border-radius:6px}

/* Overlays stay inside the device so mobile sheets look like the phone. */
#overlay{position:absolute;inset:0;z-index:5}
.scrim{position:absolute;inset:0;background:rgba(3,5,6,.62)}
.drawer{position:absolute;top:0;right:0;bottom:0;width:490px;max-width:100%;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line-strong);box-shadow:var(--shadow,0 20px 56px rgba(0,0,0,.55))}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:500px;max-width:calc(100% - 24px);max-height:calc(100% - 40px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line-strong);border-radius:16px;box-shadow:0 20px 56px rgba(0,0,0,.55)}
.device.mobile .drawer,.device.mobile .sheet{inset:0;left:0;top:0;transform:none;width:100%;max-width:none;max-height:none;border:0;border-radius:29px;overflow:hidden}
.ov-head{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 13px;border-bottom:1px solid var(--line);flex-shrink:0}
.ov-head>div{flex:1;min-width:0}
.ov-head h2{font:400 22px/1.2 var(--serif);color:var(--heading)}
.device.mobile .ov-head{padding-top:30px}
.ov-body{flex:1;min-height:0;overflow:auto;padding:16px 18px}
.ov-body>.sec{margin-left:0;margin-right:0}
.ov-foot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--header);flex-shrink:0}
.ov-foot button{flex:1;min-height:42px}
.device.mobile .ov-foot{padding-bottom:26px}
.bullets{display:grid;gap:7px;margin:10px 0}
.bullets li{display:flex;gap:9px;font-size:13.5px;color:#c9cdd1}
.bullets svg{width:15px;height:15px;margin-top:3px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;max-width:90vw;padding:11px 18px;font-size:13px;text-align:center;background:#d6ece3;color:#0b2a20;border-radius:11px;box-shadow:0 8px 40px rgba(0,0,0,.6)}

/* Small shared pieces. */
function expiredLogins() { return S.logins.filter(login => login.state === 'expired' && login.machine === S.host); }
function pendingCount() { return (S.approval.state === 'done' || S.approval.state === 'rejected' ? 0 : 1) + S.notices.length + expiredLogins().length; }
function inviteCount() { return S.invites.filter(invite => invite.state === 'pending').length; }
function findableOn(key) { const on = RELAYS.filter(relay => S.discovery[key][relay]); return on.length ? `Findable on ${on.join(', ')}` : 'Not findable'; }
const trail = steps => `<ol class="trail" aria-label="Request progress">${steps.map(step => `<li class="${step.state}"><i></i>${step.label}</li>`).join('')}</ol>`;
function head(title, sub, iconHtml = '', right = '') {
  const back = S.device === 'mobile' ? `<button class="icon ghost" data-act="back" aria-label="Back">${ic('back')}</button>` : '';
  return `<header class="head">${back}${iconHtml}<div class="head-text"><h2>${title}</h2><p>${sub}</p></div><div class="head-actions">${right}</div></header>`;
}
function composer(kind, placeholder, foot = '', hint = '') {
  return `<div class="composer-wrap"><form class="composer" data-submit="${kind}"><textarea name="text" rows="1" required placeholder="${placeholder}" aria-label="${placeholder}"></textarea><div class="composer-foot">${foot}<span class="spacer">${hint}</span><button class="primary icon" aria-label="Send">${ic('send')}</button></div></form></div>`;
}

/* Lists used by the rail and the phone tabs. */
function assistantRows() {
  return Object.entries(MY_ASSISTANTS).map(([id, item]) => {
    const current = S.device === 'desktop' && S.screen === 'assistant' && S.assistant === id;
    const count = id === 'work' ? pendingCount() : 0;
    return `<button class="row" data-act="open" data-screen="assistant" data-assistant="${id}" aria-current="${current}">${bot(item.cls)}<span class="row-text"><strong><span>${item.name}</span></strong><small>${S.defaultAssistant === id ? 'Default · ' : ''}${findableOn(id)}</small></span>${count ? `<span class="badge" aria-label="${count} waiting">${count}</span>` : ''}</button>`;
  }).join('');
}
function groupRows() {
  const invites = inviteCount();
  const inviteRow = `<button class="row" data-act="open" data-screen="invites" aria-current="${S.device === 'desktop' && S.screen === 'invites'}"><span class="av ghost" aria-hidden="true">${ic('send-out')}</span><span class="row-text"><strong><span>Invitations</span></strong><small>${invites ? `${invites} waiting for you` : 'Nothing waiting'}</small></span>${invites ? `<span class="badge">${invites}</span>` : ''}</button>`;
  return inviteRow + Object.entries(S.groups).map(([id, group]) => {
    const current = S.device === 'desktop' && S.screen === 'group' && S.group === id;
    return `<button class="row" data-act="open" data-screen="group" data-group="${id}" aria-current="${current}"><span class="av" aria-hidden="true">${ic('people')}</span><span class="row-text"><strong><span>${esc(group.name)}</span></strong><small>${group.relay}${group.hostOnline ? '' : ' · Host offline'}</small></span></button>`;
  }).join('');
}
function threadStatus(thread) {
  const lastTrail = [...thread.messages].reverse().find(message => message.trail);
  if (!lastTrail) return 'No requests yet';
  const active = lastTrail.trail.find(step => step.state === 'now' || step.state === 'stop');
  return active ? active.label : 'Completed';
}
function requestRows() {
  return Object.entries(S.threads).map(([id, thread]) => {
    const current = S.device === 'desktop' && S.screen === 'thread' && S.thread === id;
    return `<button class="row" data-act="open" data-screen="thread" data-thread="${id}" aria-current="${current}">${bot('other')}<span class="row-text"><strong><span>${thread.assistant}</span></strong><small>${thread.firstName}’s assistant · ${threadStatus(thread)}</small></span></button>`;
  }).join('');
}
function rail() {
  return `<aside class="rail">
    <div class="brand"><span class="brand-mark">b</span>joint bob<a href="#" data-act="toast" data-msg="Returns to the workspace, as it does today.">Workspace</a></div>
    <button class="rail-search" data-act="open" data-screen="find">${ic('search')} Find people and assistants</button>
    <div class="sec">Assistants</div>${assistantRows()}
    <div class="sec">Groups<button class="ghost" data-act="overlay" data-type="newGroup" aria-label="New group">${ic('plus')}</button></div>${groupRows()}
    <div class="sec">Requests</div>${requestRows()}
    <div class="rail-foot"><button class="row" data-act="open" data-screen="you" aria-current="${S.screen === 'you'}">${av('IG', 'you')}<span class="row-text"><strong><span>Ilia German</span></strong><small>Who can find you</small></span></button></div>
  </aside>`;
}

/* Assistant workspace. */
function assistantView() {
  const item = MY_ASSISTANTS[S.assistant];
  const count = S.assistant === 'work' ? pendingCount() : 0;
  const tabs = [['chat', 'Chat'], ['resources', 'Resources'], ['actions', 'Public actions'], ['settings', 'Settings'], ['saved', 'Saved items']];
  const right = `<button data-act="overlay" data-type="activity" aria-label="Activity${count ? `, ${count} waiting` : ''}">${ic('bell')}${S.device === 'mobile' ? '' : ' Activity'}${count ? `<span class="badge">${count}</span>` : ''}</button>`;
  const body = { chat: chatTab, resources: resourcesTab, actions: actionsTab, settings: settingsTab, saved: savedTab }[S.tab]();
  return `<div class="view">${head(item.name, `${S.defaultAssistant === S.assistant ? 'Your default · ' : ''}${findableOn(S.assistant)}`, bot(item.cls), right)}
    <div class="tabs" role="tablist">${tabs.map(([id, label]) => `<button role="tab" data-act="tab" data-v="${id}" aria-selected="${S.tab === id}">${label}</button>`).join('')}</div>${body}</div>`;
}
function chatTab() {
  const name = MY_ASSISTANTS[S.assistant].name;
  const approvals = S.approval.state === 'done' || S.approval.state === 'rejected' ? 0 : 1;
  const notices = S.notices.length;
  const signIns = expiredLogins().length;
  const parts = [approvals ? '1 approval' : '', notices ? `${notices} notice${notices > 1 ? 's' : ''}` : '', signIns ? `${signIns} sign-in` : ''].filter(Boolean).join(', ');
  const strip = S.assistant === 'work' && parts ? `<div class="strip ${approvals || signIns ? '' : 'info'}"><span>Waiting for you: ${parts}</span><button data-act="overlay" data-type="activity">Review</button></div>` : '';
  const timeline = S.assistant === 'work' ? S.chat : [{ text: `${name} is ready. Your private chat stays separate from groups and requests.` }];
  const foot = `<button type="button" data-act="toast" data-msg="Opens today’s scheduled task form.">Scheduled task</button><button type="button" data-act="toast" data-msg="Opens today’s webhook form.">Webhook</button>`;
  return `${strip}<div class="scroll"><div class="msgs"><div class="sys">Today · Only you see this chat</div>${timeline.map(message => message.me ? `<div class="m me"><div class="bubble">${esc(message.text)}</div></div>` : `<div class="m bot-msg">${bot(MY_ASSISTANTS[S.assistant].cls)}<div class="bubble">${esc(message.text)}</div></div>`).join('')}</div></div>${composer('privateChat', `Message ${name}…`, foot)}`;
}
function savedTab() {
  return `<div class="scroll"><div class="narrow"><div class="card"><h3>Laptop comparison notes</h3><p class="muted">Personal · Saved 28 Oct</p></div><p class="fine">Saved items don’t change. They stay private and aren’t available to groups or requests.</p></div></div>`;
}
function relaySwitches(key) {
  return RELAYS.map(relay => `<div class="row-text" style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)"><span>${relay}</span>${relaySwitch(key, relay)}</div>`).join('');
}
function relaySwitch(key, relay) {
  const label = key === 'you' ? 'You' : MY_ASSISTANTS[key].name;
  return `<button type="button" class="switch" role="switch" aria-checked="${S.discovery[key][relay]}" aria-label="${label} findable on ${relay}" data-act="discover" data-key="${key}" data-relay="${relay}"></button>`;
}
function settingsTab() {
  const item = MY_ASSISTANTS[S.assistant];
  return `<div class="scroll"><div class="narrow">
    <div class="settings-sec"><h3>Instructions</h3><p>Your private instructions. Execution settings and terminal use stay as they are today. Skills, plugins, MCP servers, secrets and browser logins moved to Resources.</p>
      <label class="field">Name<input value="${item.name}"></label>
      <label class="field">Instructions<textarea rows="3">Keep my calendar tidy and tell me about anything urgent in my groups.</textarea></label>
      <label class="field">Decision model<select data-bind="decisionModel"><option ${S.decisionModel === 'TypeSafe' ? 'selected' : ''}>TypeSafe</option><option ${S.decisionModel === 'Laya' ? 'selected' : ''}>Laya</option></select><small>Decides what this assistant may do for other people. The agent can’t override it.</small></label></div>
    <div class="settings-sec"><h3>Default assistant</h3><p>Your default joins every group you join and leaves when you leave.</p>
      ${S.defaultAssistant === S.assistant ? `<p>${chip('Default', 'ok')} This is your default assistant.</p>` : `<button data-act="setDefault" data-v="${S.assistant}">Make this my default</button>`}</div>
    <div class="settings-sec"><h3>Who can find this assistant</h3><p>Signed-in people on these relays can find it and see its public actions. Its listing names you as its owner.</p>${relaySwitches(S.assistant)}</div>
  </div></div>`;
}

/* Resources: everything this assistant can use in your private chat and its topics. */
const RES_SECTIONS = [['browser', 'Browser logins', 'globe'], ['skills', 'Skills', 'book'], ['plugins', 'Plugins', 'puzzle'], ['mcp', 'MCP servers', 'plug'], ['secrets', 'Secrets', 'key']];
const RES_COPY = {
  browser: 'Sites this assistant stays signed in to. You sign in yourself, and it never sees your password or codes. One topic uses a login at a time.',
  skills: 'Every topic this assistant opens can use the skills you turn on.',
  plugins: 'A plugin adds a set of skills and MCP servers. Its skills appear under Skills.',
  mcp: 'Servers this assistant can call. Install new servers in Joint Bob Resources first.',
  secrets: 'Accounts this assistant can use. Values stay in Settings → Secrets and are never shown here.',
};
const resItems = section => ({ browser: S.logins, skills: S.skills, plugins: S.plugins, mcp: S.mcp, secrets: S.secrets })[section];
const available = item => !item.plugin || S.plugins.find(plugin => plugin.name === item.plugin).on;
const lockedSecret = item => item.decision === S.decisionModel;
const box = name => `<span class="site" aria-hidden="true">${ic(name)}</span>`;
function resSummary(section) {
  const items = resItems(section);
  if (section === 'browser') {
    const attention = items.filter(login => login.state === 'expired' || login.machine !== S.host).length;
    return `${items.length} login${items.length === 1 ? '' : 's'}${attention ? ` · ${attention} need${attention === 1 ? 's' : ''} you` : ''}`;
  }
  const on = items.filter(item => item.on && available(item)).length;
  const signIn = section === 'mcp' && items.some(item => item.needsSignIn && item.on && available(item)) ? ' · 1 needs sign-in' : '';
  return `${on} of ${items.length} ${section === 'secrets' ? 'attached' : 'on'}${signIn}`;
}
function toggle(section, item, label, enabled = true) {
  return `<button type="button" class="switch" role="switch" aria-checked="${item.on && enabled}" aria-label="${esc(label)}" data-act="toggleRes" data-section="${section}" data-v="${esc(item.name)}" ${enabled ? '' : 'disabled'}></button>`;
}
function resRow({ glyph, title, chipHtml = '', detail, control, off = false }) {
  return `<div class="res-row${off ? ' off' : ''}">${glyph}<span class="row-text"><strong><span>${title}</span>${chipHtml}</strong><small title="${esc(detail)}">${esc(detail)}</small></span><span class="res-ctl">${control}</span></div>`;
}
function loginRow(login) {
  const glyph = `<span class="site" aria-hidden="true">${esc(login.name[0])}</span>`;
  const off = !S.allowBrowser;
  if (login.machine !== S.host) return resRow({ glyph, title: esc(login.name), off, chipHtml: chip('Other machine', 'bad'), detail: `${login.site} · On ${login.machine}, not ${S.host}`, control: `<button data-act="signInLogin" data-v="${login.id}">${S.device === 'mobile' ? 'Sign in' : `Sign in on ${S.host}`}</button>` });
  if (login.state === 'expired') return resRow({ glyph, title: esc(login.name), off, chipHtml: chip('Signed out', 'amber'), detail: `${login.site} · ${login.machine} · Signed out on ${login.since}`, control: `<button data-act="signInLogin" data-v="${login.id}">Sign in</button>` });
  const detail = `${login.site} · ${login.machine}${login.usedBy ? ` · “${login.usedBy}” is using it. Other topics wait.` : ''}`;
  return resRow({ glyph, title: esc(login.name), off, chipHtml: chip(login.usedBy ? 'In use' : 'Signed in', 'ok'), detail, control: `<button class="ghost" data-act="detachLogin" data-v="${login.id}">Detach</button>` });
}
function resRowFor(section, item) {
  if (section === 'browser') return loginRow(item);
  const ok = available(item);
  const needsPlugin = `Turn on the ${item.plugin} plugin first`;
  if (section === 'skills') return resRow({ glyph: box('book'), title: esc(item.name), chipHtml: item.plugin ? chip(`${item.plugin} plugin`) : '', detail: ok ? item.desc : needsPlugin, control: toggle(section, item, `Use ${item.name}`, ok), off: !(item.on && ok) });
  if (section === 'plugins') return resRow({ glyph: box('puzzle'), title: esc(item.name), detail: `${item.desc} · Adds ${item.adds}`, control: toggle(section, item, `Use the ${item.name} plugin`), off: !item.on });
  if (section === 'mcp') {
    const signIn = ok && item.on && item.needsSignIn;
    return resRow({ glyph: box('plug'), title: esc(item.name), chipHtml: !ok ? chip(`${item.plugin} plugin`) : signIn ? chip('Needs sign-in', 'amber') : '', detail: ok ? item.desc : needsPlugin, control: `${signIn ? `<button data-act="mcpSignIn" data-v="${item.name}">Sign in</button>` : ''}${toggle(section, item, `Use ${item.name}`, ok)}`, off: !(item.on && ok) });
  }
  const locked = lockedSecret(item);
  return resRow({ glyph: box('key'), title: esc(item.name), chipHtml: locked ? chip('Decision model') : '', detail: locked ? `${item.vars} · The decision model needs it` : item.vars, control: toggle(section, item, `Attach ${item.name}`, !locked), off: !item.on });
}
function pageOf(section, items) {
  const size = S.resPageSize;
  const pages = Math.max(1, Math.ceil(items.length / size));
  const page = Math.min(S.resPage[section] || 0, pages - 1);
  return { rows: items.slice(page * size, page * size + size), page, pages, size, total: items.length };
}
function pager(section, info) {
  if (info.pages <= 1) return '';
  return `<div class="pager">${info.page * info.size + 1}–${Math.min(info.total, (info.page + 1) * info.size)} of ${info.total}<span><button data-act="resPage" data-section="${section}" data-v="-1" ${info.page === 0 ? 'disabled' : ''}>Previous</button><button data-act="resPage" data-section="${section}" data-v="1" ${info.page >= info.pages - 1 ? 'disabled' : ''}>Next</button></span></div>`;
}
function resTopAction(section) {
  if (section === 'browser') return `<button class="primary" data-act="overlay" data-type="addLogin" data-mode="new">${ic('plus')} Add login</button>`;
  if (section === 'secrets') return `<button data-act="toast" data-msg="Opens Settings → Secrets, where you add accounts and their values.">Manage secrets</button>`;
  return `<button data-act="toast" data-msg="Opens Joint Bob Resources, where you install new ones.">Install more</button>`;
}
function resDetail() {
  const section = S.resSection;
  const label = RES_SECTIONS.find(entry => entry[0] === section)[1];
  const info = pageOf(section, resItems(section));
  const back = S.device === 'mobile' ? `<button class="link" style="align-self:flex-start;margin-bottom:10px" data-act="closeRes">Back to resources</button>` : '';
  const bar = section === 'browser' ? `<div class="res-bar"><span>${S.allowBrowser ? 'Can use a browser' : 'Browser use is off. Logins stay saved.'}</span><button type="button" class="switch" role="switch" aria-checked="${S.allowBrowser}" aria-label="Use a browser" data-act="allowBrowser"></button></div>` : '';
  const empty = section === 'browser' ? '<div class="empty">No logins yet. Add one and sign in yourself. Every topic can use it.</div>' : '<div class="empty">Nothing installed yet.</div>';
  return `<div class="res-detail">${back}<div class="res-top"><div><h3>${label}</h3><p>${RES_COPY[section]}</p></div>${resTopAction(section)}</div>${bar}<div class="res-list">${info.rows.map(item => resRowFor(section, item)).join('') || empty}</div>${pager(section, info)}</div>`;
}
function resourcesTab() {
  const nav = `<div class="res-nav">${RES_SECTIONS.map(([id, label, icon]) => `<button class="action-item res-item" data-act="resSection" data-v="${id}" aria-current="${S.device === 'desktop' && S.resSection === id}"><strong>${ic(icon)} ${label}</strong><small>${resSummary(id)}</small></button>`).join('')}
    <div class="res-nav-foot"><p class="fine">${MY_ASSISTANTS[S.assistant].name} runs on ${S.host}. Browser logins must be on the same machine.</p><p class="fine">Only your private chat and its topics use these. Groups and requests never do.</p></div></div>`;
  if (S.device === 'mobile') return `<div class="res-layout">${S.resOpen ? resDetail() : nav}</div>`;
  return `<div class="res-layout">${nav}${resDetail()}</div>`;
}
function fitResourcePage() {
  const list = q('#shell .res-list');
  if (!list) return false;
  const size = Math.max(3, Math.floor(list.clientHeight / 58));
  if (size === S.resPageSize) return false;
  S.resPageSize = size;
  return true;
}
function findLogin(id) { return S.logins.find(login => login.id === id) || (S.pendingLogin && S.pendingLogin.id === id ? S.pendingLogin : null); }
function qrCode(seed) {
  let n = [...seed].reduce((total, char) => (Math.imul(total, 31) + char.charCodeAt(0)) >>> 0, 7);
  const finder = (r, c) => {
    for (const [fr, fc] of [[0, 0], [0, 14], [14, 0]]) {
      const y = r - fr, x = c - fc;
      if (y >= 0 && y < 7 && x >= 0 && x < 7) return y === 0 || y === 6 || x === 0 || x === 6 || (y >= 2 && y <= 4 && x >= 2 && x <= 4);
    }
    if ((r < 8 && c < 8) || (r < 8 && c > 12) || (r > 12 && c < 8)) return false;
    n = (Math.imul(n, 1103515245) + 12345) >>> 0;
    return Boolean((n >>> 16) & 1);
  };
  let cells = '';
  for (let r = 0; r < 21; r++) for (let c = 0; c < 21; c++) cells += `<i class="${finder(r, c) ? 'on' : ''}"></i>`;
  return `<div class="qr" role="img" aria-label="Sample sign-in code">${cells}</div>`;
}
function needsYou() {
  return expiredLogins().map(login => workRow('Needs sign-in', 'amber', `${login.name} signed out`, `Work assistant paused a ${login.name} step in “Job search”. Sign in to continue.`, `<button data-act="signInLogin" data-v="${login.id}">Sign in</button>`)).join('');
}

/* Public actions. */
function selectedAction() { return S.actions.find(action => action.id === S.actionSel); }
const STATUS_CHIP = { published: chip('Published', 'ok'), disabled: chip('Disabled'), draft: chip('Draft', 'amber') };
const OPS = [['freebusy', 'Read free and busy times', 'Times only, no titles or guests'], ['details', 'Read event details', 'Titles, guests and notes'], ['create', 'Create an event', 'Adds an event and sends its invitation']];
function actionsTab() {
  const list = `<div class="action-list">${S.actions.map(action => `<button class="action-item" data-act="pickAction" data-v="${action.id}" aria-current="${action.id === S.actionSel && S.device === 'desktop'}"><strong>${esc(action.name)}</strong>${STATUS_CHIP[action.status]}</button>`).join('')}<button style="width:100%" data-act="newAction">${ic('plus')} New action</button><p class="fine" style="margin-top:12px">${findableOn(S.assistant)}. <button class="link" data-act="open" data-screen="you">Change</button></p></div>`;
  if (S.device === 'mobile') return `<div class="actions-layout">${S.actionOpen ? actionEditor() : list}</div>`;
  return `<div class="actions-layout">${list}<div class="scroll">${actionEditor()}</div></div>`;
}
function actionEditor() {
  const action = selectedAction();
  const canPublish = action.ops.length > 0;
  const back = S.device === 'mobile' ? `<button class="link" style="margin-bottom:12px" data-act="closeAction">Back to actions</button><br>` : '';
  let buttons;
  if (action.status === 'published') buttons = `<button data-act="disableAction">Disable</button><button class="primary grow" data-act="toast" data-msg="Saved. Open proposals made with the old instructions are cancelled.">Save changes</button>`;
  else buttons = `<button class="primary grow" data-act="publishAction" ${canPublish ? '' : 'disabled'}>${action.status === 'disabled' ? 'Publish again' : 'Publish'}</button>`;
  const r = S.test.result;
  return `<div class="narrow">${back}
    <div class="card-top"><span>${STATUS_CHIP[action.status]}</span></div>
    <div class="editor-box"><p class="label">What people see</p>
      <label class="field">Name<input data-action-field="name" value="${esc(action.name)}"></label>
      <label class="field">Description<textarea rows="2" data-action-field="desc">${esc(action.desc)}</textarea></label>
      <label class="field">What people provide<input data-action-field="inputs" value="${esc(action.inputs)}"></label></div>
    <div class="editor-box"><p class="private-tag">${ic('lock')} Only you and the decision model see this</p>
      <label class="field" style="margin-top:8px">Instructions<textarea rows="3" data-action-field="instructions">${esc(action.instructions)}</textarea><small>Write who it’s for and when to ask you first. ${S.decisionModel} decides from this for every request.</small></label></div>
    <div class="editor-box"><p class="label">What it’s allowed to do</p><p class="group-label">Calendar: Work</p>
      ${OPS.map(([id, title, sub]) => `<label class="op"><input type="checkbox" data-op="${id}" ${action.ops.includes(id) ? 'checked' : ''}><span>${title}<small>${sub}</small></span></label>`).join('')}
      <p class="fine" style="margin-top:8px">Terminal, full browser and whole MCP servers can’t be used for a public action.</p>
      ${canPublish ? '' : '<div class="notice" style="margin:10px 0 0">'+ic('alert')+'<span>This stays a draft until you choose what it’s allowed to do.</span></div>'}</div>
    <div class="editor-box"><p class="label">Test this action</p>
      <form data-submit="testAction"><div class="pair"><label class="field">Ask as<select name="caller">${['Dan Cohen', 'Noa Levi', 'Someone new'].map(name => `<option ${S.test.caller === name ? 'selected' : ''}>${name}</option>`).join('')}</select></label>
      <label class="field">Request<input name="request" value="30 minutes on Thursday at 15:00"></label></div>
      <button ${canPublish ? '' : 'disabled'}>Run test</button></form>
      ${r ? `<div class="exact"><p class="label">Decision</p><p>${chip(r.decision, r.ok ? 'ok' : 'amber')}</p><p class="gap" style="margin-top:7px">${r.detail}</p><p class="fine" style="margin-top:7px">Test only. No event was created and nothing was sent.</p></div>` : '<p class="fine" style="margin-top:8px">A test never touches your calendar or sends anything.</p>'}</div>
    <div class="actions" style="margin-top:0">${buttons}</div></div>`;
}

/* Who can find you. */
function youView() {
  const items = [['you', 'You', av('IG', 'you')], ...Object.entries(MY_ASSISTANTS).map(([id, item]) => [id, item.name, bot(item.cls)])];
  const groupsWith = Object.values(S.groups).map(group => { const me = group.tree.find(person => person.you); const companion = me && me.bots.find(item => item.link === 'with'); return `<tr><td style="text-align:left">${esc(group.name)}</td><td style="text-align:left">${companion ? companion.name : 'None'}</td></tr>`; }).join('');
  return `<div class="view">${head('Who can find you', 'Off until you turn it on, separately for each relay')}
  <div class="scroll"><div class="narrow">
    <section class="settings-sec"><h3>Findable on</h3><p>Signed-in people on a relay can find what you turn on there. Nothing is on the public Internet.</p>
      <table class="matrix"><thead><tr><th scope="col"></th>${RELAYS.map(relay => `<th scope="col">${relay}</th>`).join('')}</tr></thead><tbody>${items.map(([key, label, icon]) => `<tr><td><span style="display:inline-flex;gap:9px;align-items:center">${icon}${label}</span></td>${RELAYS.map(relay => `<td>${relaySwitch(key, relay)}</td>`).join('')}</tr>`).join('')}</tbody></table>
      ${S.ownerNote ? `<div class="notice" style="margin-top:12px">${ic('info')}<span>An assistant’s listing names you as its owner, even on a relay where you aren’t findable yourself.</span></div>` : ''}</section>
    <section class="settings-sec"><h3>What people see</h3><p>Your listings show only this.</p>
      <div class="pair"><div class="card"><div class="listing">${av('IG', 'you')}<div><strong>Ilia German</strong><p class="fine">Person · Verified home: homeserver</p></div></div></div>
      <div class="card"><div class="listing">${bot()}<div><strong>Work assistant</strong><p class="fine">Assistant · Owned by Ilia German</p><p class="fine">See my availability, Arrange a meeting</p></div></div></div></div>
      <p class="fine">Never in a listing:</p><div class="never">${['Email', 'Private instructions', 'Credentials', 'Projects', 'Calendar contents', 'Private chats'].map(item => chip(item)).join('')}</div></section>
    <section class="settings-sec"><h3>Default assistant</h3><p>It joins every group you join from now on and leaves when you leave. Everyone in the group can see it.</p>
      <div role="radiogroup" aria-label="Default assistant">${Object.entries(MY_ASSISTANTS).map(([id, item]) => `<button class="radio" role="radio" aria-checked="${S.defaultAssistant === id}" data-act="setDefault" data-v="${id}"><span class="dot"></span>${bot(item.cls)}${item.name}</button>`).join('')}<button class="radio" role="radio" aria-checked="${S.defaultAssistant === null}" data-act="setDefault" data-v=""><span class="dot"></span>No default. Only I join groups.</button></div>
      <p class="fine" style="margin:12px 0 6px">Changing this doesn’t change the groups you’re already in:</p>
      <table class="matrix"><thead><tr><th scope="col" style="text-align:left">Group</th><th scope="col" style="text-align:left">Joined with</th></tr></thead><tbody>${groupsWith}</tbody></table></section>
    <section class="settings-sec"><h3>Blocked people</h3><p>A block applies at once, including to requests already in progress.</p>
      ${S.blocked.length ? S.blocked.map(person => `<div class="work" style="align-items:center">${av(person.name.split(' ').map(part => part[0]).join(''))}<div><strong>${esc(person.name)}</strong><small>Verified home: ${esc(person.origin)}</small></div><button data-act="unblock" data-v="${esc(person.name)}">Unblock</button></div>`).join('') : '<p class="fine">Nobody is blocked.</p>'}</section>
    <section class="settings-sec"><h3>Limits</h3><p>Requests over a limit are refused before any model runs, so strangers can’t run up your usage.</p>
      <div class="pair"><label class="field">Requests per person each day<input type="number" value="20" min="1"></label><label class="field">Decision checks per assistant each day<input type="number" value="200" min="1"></label></div></section>
  </div></div></div>`;
}

/* One search across every active relay. */
function findResults() {
  const query = S.findQuery.trim().toLowerCase();
  const results = DIRECTORY.filter(entry => (S.partnersUp || !entry.viaPartners)
    && (S.findFilter === 'all' || entry.kind === S.findFilter)
    && (!query || `${entry.name} ${entry.owner || ''} ${entry.desc}`.toLowerCase().includes(query)));
  if (!results.length) return `<div class="empty">Nobody matches “${esc(S.findQuery)}”. People and assistants appear here only if they turned on discovery.</div>`;
  return results.map(entry => `<button class="result" data-act="overlay" data-type="profile" data-id="${entry.id}">${entry.kind === 'person' ? av(entry.initials) : bot('other')}<span class="row-text"><strong><span>${entry.name}</span>${chip(entry.kind === 'person' ? 'Person' : 'Assistant')}</strong><small>${entry.kind === 'person' ? `${entry.desc} · Verified home: ${entry.origin}` : `Owned by ${entry.owner} (${entry.origin}) · ${entry.desc}`}</small><span class="chips result-routes">${entry.relays.map(relay => chip(relay)).join('')}</span></span></button>`).join('');
}
function findBody() {
  const banner = S.partnersUp ? '' : `<div class="notice">${ic('alert')}<span><strong>Partners didn’t respond.</strong> Anyone only on that relay is missing from these results.</span><button style="min-height:30px;padding:2px 10px" data-act="retryPartners">Retry</button></div>`;
  const filters = [['all', 'All'], ['person', 'People'], ['assistant', 'Assistants']];
  return `<div class="search">${ic('search')}<input id="find-input" type="search" placeholder="Search by name or what they do" aria-label="Find people and assistants" value="${esc(S.findQuery)}"></div>
    <div class="find-bar"><small>Searching ${S.partnersUp ? 'Home, Team and Partners' : 'Home and Team. Partners is unavailable.'}</small><div class="seg">${filters.map(([id, label]) => `<button data-act="findFilter" data-v="${id}" aria-pressed="${S.findFilter === id}">${label}</button>`).join('')}</div></div>
    ${banner}<div id="find-results">${findResults()}</div>`;
}
function findView() {
  if (S.device === 'mobile') return `<div class="view"><h2 class="page-title">Find</h2><div class="scroll"><div class="narrow" style="padding-top:0">${findBody()}</div></div></div>`;
  return `<div class="view">${head('Find people and assistants', 'Searches all your active relays together')}<div class="scroll"><div class="narrow">${findBody()}</div></div></div>`;
}

/* Direct request thread. */
function threadView() {
  const thread = S.threads[S.thread];
  const body = thread.messages.map(message => {
    if (message.me) return `<div class="m me"><div class="bubble">${esc(message.text)}</div></div>`;
    if (message.trail) return `<div class="m-trail">${trail(message.trail)}</div>`;
    return `<div class="m bot-msg">${bot('other')}<div><div class="who"><b>${thread.assistant}</b>Assistant · For ${thread.firstName}</div><div class="bubble">${esc(message.reply)}</div></div></div>`;
  }).join('');
  const right = `<button class="ghost" data-act="block" data-v="${thread.owner}">Block</button>`;
  return `<div class="view">${head(thread.assistant, `${thread.owner}’s assistant${S.device === 'mobile' ? '' : ` · Through ${thread.via}`}`, bot('other'), right)}
    <div class="scroll"><div class="msgs">
      <div class="notice plain" style="margin:0">${ic('lock')}<span>This thread is between you and this assistant. It can’t use ${thread.firstName}’s private chats, and only ${thread.firstName} can review what it does here.</span></div>
      <div><p class="label">You can ask for</p><div class="catalog">${thread.catalog.map(([name, desc, sample]) => `<button data-act="fillComposer" data-text="${esc(sample)}"><strong>${name}</strong><small>${desc}</small></button>`).join('')}</div></div>
      ${body}</div></div>${composer('threadSend', `Ask ${thread.assistant}…`, '', 'Only what’s listed above can be requested')}</div>`;
}

/* Group chat. */
function memberTree(group) {
  const person = member => `<div class="tree-person">${av(member.initials, member.you ? 'you' : member.absent ? 'ghost' : '')}<div class="tree-text"><b>${esc(member.name)}</b>${member.note ? `<small>${member.note}</small>` : ''}</div>${group.mine && !member.you && !member.absent ? `<button class="ghost tree-remove" data-act="overlay" data-type="remove" data-name="${esc(member.name)}">Remove</button>` : ''}</div>`;
  const assistant = (item, member) => `<div class="tree-bot ${item.link === 'alone' ? 'alone' : ''}">${bot(item.cls)}<div class="tree-text"><b>${item.name}</b><small>${item.note}</small><small class="watch ${item.watching ? '' : 'pending'}">${item.watching ? 'Watching' : item.pendingWhy}</small></div>${group.mine && item.link === 'alone' ? `<button class="ghost tree-remove" data-act="overlay" data-type="remove" data-name="${item.name}" data-assistant-only="1">Remove</button>` : ''}</div>`;
  return group.tree.map(member => person(member) + member.bots.map(item => assistant(item, member)).join('')).join('');
}
function membersBody(group) {
  const pending = group.pending.length ? `<div class="sec" style="margin:14px 0 2px">Invited</div>${group.pending.map(name => `<div class="tree-person">${av(name.split(' ').map(part => part[0]).join('').slice(0, 2), 'ghost')}<div class="tree-text"><b>${esc(name)}</b><small>Waiting for an answer</small></div></div>`).join('')}` : '';
  return `${memberTree(group)}${pending}
    <p class="fine" style="margin-top:14px">An assistant reads new messages and can report them to its owner, who can review what it saw and decided here.</p>
    <div class="members-foot"><button data-act="overlay" data-type="invite">${ic('plus')} Invite a person or assistant</button>
    ${group.mine ? `<button class="danger" data-act="overlay" data-type="closeGroup">Close group</button>` : `<button class="danger" data-act="overlay" data-type="leave">Leave group</button>`}</div>`;
}
function groupView() {
  const group = S.groups[S.group];
  const count = group.tree.reduce((total, member) => total + (member.absent ? 0 : 1) + member.bots.length, 0);
  const right = S.device === 'mobile' ? `<button data-act="overlay" data-type="members" aria-label="${count} members">${ic('people')} ${count}</button>` : '';
  const offline = group.hostOnline ? '' : `<div class="strip warn">${ic('alert')}<span>${group.host[0].toUpperCase() + group.host.slice(1)} hosts this group and is offline. New messages wait on this device until it’s back.</span></div>`;
  const messages = group.messages.map(message => {
    if (message.sys) return `<div class="sys">${message.sys}</div>`;
    if (message.me) return `<div class="m me"><div><div class="bubble">${esc(message.text)}</div><div class="send-state">${message.status}</div></div></div>`;
    if (message.botName) return `<div class="m bot-msg">${bot(message.botCls)}<div><div class="who"><b>${message.botName}</b>Assistant · For ${message.owner}</div><div class="bubble">${esc(message.text)}</div></div></div>`;
    return `<div class="m">${av(message.initials)}<div><div class="who"><b>${message.from}</b></div><div class="bubble">${esc(message.text)}</div></div></div>`;
  }).join('');
  const side = S.device === 'desktop' ? `<aside class="members" aria-label="Members"><div class="sec" style="margin:0 0 4px">Members · ${count}</div>${membersBody(group)}</aside>` : '';
  return `<div class="view">${head(esc(group.name), `${group.relay} · Hosted on ${group.host}${group.hostOnline ? '' : ' · Offline'}`, `<span class="av" aria-hidden="true">${ic('people')}</span>`, right)}
    <div class="split"><div class="col">${offline}<div class="scroll"><div class="msgs">${messages}</div></div>${composer('groupSend', `Message ${esc(group.name)}…`)}</div>${side}</div></div>`;
}

/* Invitations. */
function inviteCard(invite) {
  if (invite.state !== 'pending') return `<article class="card ${invite.state === 'accepted' ? 'done' : ''}"><div class="card-top"><strong>${esc(invite.group)}</strong>${chip(invite.state === 'accepted' ? 'Accepted' : 'Declined', invite.state === 'accepted' ? 'ok' : '')}</div><p class="muted">${invite.result}</p></article>`;
  if (invite.kind === 'assistant') {
    const item = MY_ASSISTANTS[invite.assistant];
    return `<article class="card"><div class="card-top"><div class="chips">${chip(invite.relay)}${chip('For your assistant', 'amber')}</div><small>Expires ${invite.expires}</small></div>
      <h3>${invite.from} invited ${item.name} to ${invite.group}</h3>
      <ul class="bullets"><li>${ic('dot')}You won’t join the group, and you can’t read it directly.</li><li>${ic('dot')}${item.name} will read new messages and report to you.</li><li>${ic('dot')}Members will see you as its owner.</li></ul>
      <div class="actions"><button data-act="declineInvite" data-v="${invite.id}">Decline</button><button class="primary grow" data-act="acceptInvite" data-v="${invite.id}">Approve for ${item.name}</button></div></article>`;
  }
  const companion = S.defaultAssistant && MY_ASSISTANTS[S.defaultAssistant];
  const connect = invite.needsConnection ? `<div class="notice" style="margin:10px 0 0">${ic('alert')}<span>${companion ? companion.name : 'Your default assistant'} runs on Homeserver, which isn’t connected to ${invite.relay}. Connect it to accept.</span><button style="min-height:30px;padding:2px 10px" data-act="connectRelay" data-v="${invite.id}">Connect</button></div>` : '';
  return `<article class="card"><div class="card-top"><div class="chips">${chip(invite.relay)}</div><small>Expires ${invite.expires}</small></div>
    <h3>${invite.from} invited you to ${invite.group}</h3>
    <ul class="bullets">${companion ? `<li>${ic('dot')}${companion.name} joins with you, and everyone can see it.</li>` : `<li>${ic('dot')}You join alone because you have no default assistant.</li>`}<li>${ic('dot')}You’ll see messages from when you join, not earlier ones.</li></ul>${connect}
    <div class="actions"><button data-act="declineInvite" data-v="${invite.id}">Decline</button><button class="primary grow" data-act="acceptInvite" data-v="${invite.id}" ${invite.needsConnection ? 'disabled' : ''}>Accept</button></div></article>`;
}
function invitesView() {
  const stateChip = { Pending: 'amber', Declined: '', Expired: '', Revoked: '' };
  return `<div class="view">${head('Invitations', 'Nobody joins a group or sees its messages until they accept')}
  <div class="scroll"><div class="narrow"><div class="sec" style="margin:0 0 8px">Received</div>${S.invites.map(inviteCard).join('')}
    <div class="sec" style="margin:18px 0 4px">Sent</div>${S.sent.map(item => `<div class="work" style="align-items:center"><div><strong>${esc(item.who)}</strong><small>${esc(item.group)}</small></div>${chip(item.state, stateChip[item.state])}${item.state === 'Pending' ? `<button style="min-height:30px;padding:2px 10px" data-act="revokeInvite" data-v="${item.id}">Revoke</button>` : ''}</div>`).join('')}
  </div></div></div>`;
}

/* Activity drawer: the owner's private review surface. */
function approvalCard() {
  const a = S.approval;
  if (a.state === 'rejected') return `<article class="card"><div class="card-top"><strong>Arrange a meeting</strong>${chip('Rejected')}</div><p class="muted">Nothing was booked or posted.</p></article>`;
  if (a.state === 'done') return `<article class="card done"><div class="card-top"><strong>Arrange a meeting</strong>${chip('Completed', 'ok')}</div>${trail([DONE('Recorded'), DONE('Decision'), DONE('Your approval'), DONE('Executing'), DONE('Completed')])}<dl class="kv"><dt>Calendar</dt><dd>Confirmed the event</dd><dt>Launch crew</dt><dd>Reply posted</dd></dl><div class="actions"><button data-act="open" data-screen="group" data-group="launch">Open Launch crew</button></div></article>`;
  const executing = a.state === 'executing';
  const checking = a.state === 'checking';
  const steps = [DONE('Recorded'), checking ? NOW('Awaiting decision') : DONE('Decision'), executing ? DONE('Your approval') : checking ? TODO('Your approval') : NOW('Your approval'), executing ? NOW('Executing') : TODO('Executing'), TODO('Completed')];
  const replyBlock = a.state === 'editing'
    ? `<form data-submit="editProposal"><label class="field gap" style="margin:10px 0 0">Reply to post in Launch crew<textarea name="reply" rows="3" required>${esc(a.reply)}</textarea><small>Your edit becomes a new proposal, and the decision model checks it before you can approve it.</small></label><div class="actions"><button type="button" data-act="cancelEdit">Cancel</button><button class="primary grow">Send for a new check</button></div></form>`
    : `<div class="exact"><p class="label">Would post in Launch crew as Work assistant, for Ilia</p><p>${esc(a.reply)}</p></div>`;
  const buttons = a.state === 'pending' ? `<div class="actions"><button data-act="rejectProposal">Reject</button><button data-act="editProposal">Edit</button><button class="primary grow" data-act="approveProposal">Approve once</button></div><p class="fine" style="margin-top:8px">Approval covers only this event and this reply, one time.</p>` : '';
  return `<article class="card attention"><div class="card-top">${chip(executing ? 'Executing' : checking ? 'Awaiting decision' : 'Awaiting your approval', 'amber')}<small>Proposal ${a.rev}</small></div>
    <h3>Arrange a meeting</h3><p class="muted">Noa Levi asked in Launch crew</p><div class="gap">${trail(steps)}</div>
    <blockquote class="quote">“Ilia, can you do 30 minutes on Thursday at 15:00 for the vendor review?”</blockquote>
    <dl class="kv"><dt>Would do</dt><dd>Create a calendar event</dd><dt>Calendar</dt><dd>Work</dd><dt>When</dt><dd>Thu 5 Nov, 15:00–15:30 (Asia/Jerusalem)</dd><dt>Title</dt><dd>Vendor review</dd><dt>Guest</dt><dd>Noa Levi</dd></dl>
    ${replyBlock}
    <div class="exact"><p class="label">${S.decisionModel} decided: ask you first</p><p class="fine" style="color:#c9cdd1">From your instructions: “Book Dan directly when the slot is free. Ask me first for anyone else.”</p></div>${buttons}</article>`;
}
function workRow(label, cls, title, detail, buttons = '') {
  return `<div class="work">${chip(label, cls)}<div><strong>${title}</strong><small>${detail}</small>${buttons ? `<div class="work-actions">${buttons}</div>` : ''}</div></div>`;
}
const overlays = {
  activity() {
    const name = MY_ASSISTANTS[S.assistant].name;
    if (S.assistant !== 'work') return `<div class="scrim" data-act="closeOverlay"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="ov-title"><header class="ov-head"><div><p class="eyebrow">Only you see this</p><h2 id="ov-title">${name} activity</h2></div><button class="icon ghost" data-act="closeOverlay" aria-label="Close activity">${ic('close')}</button></header><div class="ov-body"><div class="empty">Nothing yet. When ${name} joins a group or gets a request, it shows up here.</div></div></aside>`;
    const notices = S.notices.map(notice => `<div class="work"><div><strong>${notice.title}</strong><small>${notice.from}</small><div class="work-actions"><button data-act="open" data-screen="group" data-group="${notice.group}">Open group</button><button class="ghost" data-act="dismissNotice" data-v="${notice.id}">Mark as read</button></div></div></div>`).join('');
    return `<div class="scrim" data-act="closeOverlay"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="ov-title">
      <header class="ov-head"><div><p class="eyebrow">Only you see this</p><h2 id="ov-title">${name} activity</h2></div><button class="icon ghost" data-act="closeOverlay" aria-label="Close activity and return to chat">${ic('close')}</button></header>
      <div class="ov-body">${approvalCard()}
        ${notices || needsYou() ? `<div class="sec">Notices</div>${needsYou()}${notices}` : ''}
        <div class="sec">Other work</div>
        ${workRow('Executing', 'amber', 'See my availability', 'Noa Levi · Launch crew')}
        ${workRow('Awaiting decision', 'amber', 'Arrange a meeting', 'Lior Ben-Ami · Direct request')}
        ${workRow('Completed', 'ok', 'See my availability', 'Dan Cohen · Direct request · Shared free and busy times')}
        ${workRow('Declined', '', 'Arrange a meeting', 'Ron Katz · Direct request · Your instructions don’t allow this', `<button data-act="block" data-v="Ron Katz">Block Ron Katz</button>`)}
        ${workRow('Blocked', 'bad', 'Arrange a meeting', 'Dan Cohen · Family trip · The Work calendar needs reconnecting. Nothing happened.', `<button data-act="toast" data-msg="Opens calendar access for this assistant.">Fix access</button>`)}
        ${workRow('Failed', 'bad', 'See my availability', 'Noa Levi · Launch crew · The decision model didn’t respond, so nothing happened.', `<button data-act="toast" data-msg="Runs the same check again.">Check again</button>`)}
        ${S.uncertain ? workRow('Uncertain', 'amber', 'Arrange a meeting', 'Maya Shalev · Direct request · The calendar didn’t confirm this event. Check your calendar before trying again.', `<button data-act="resolveUncertain">It was created</button><button data-act="resolveUncertain">It wasn’t created</button>`) : ''}
        ${workRow('Recorded', '', '14 messages in Launch crew', 'Nothing needed you, so no agent ran.')}
      </div></aside>`;
  },
  members() {
    const group = S.groups[S.group];
    return sheet(`${esc(group.name)} members`, membersBody(group));
  },
  profile({ id }) {
    const entry = DIRECTORY.find(item => item.id === id);
    const routes = `<div class="chips gap" style="margin-top:7px"><small>Reachable through</small>${entry.relays.map(relay => chip(relay)).join('')}</div>`;
    if (entry.kind === 'person') {
      return sheet(entry.name, `<div class="listing">${av(entry.initials)}<div><p>${entry.desc}</p><p class="fine">Person · Verified home: ${entry.origin}</p></div></div>${routes}<p class="fine" style="margin-top:14px">You can talk with people in groups. Invite ${entry.name.split(' ')[0]} to one and they decide whether to join.</p>`,
        `<button data-act="block" data-v="${entry.name}">Block</button><button class="primary" data-act="overlay" data-type="invite" data-who="${entry.name}">Invite to a group</button>`);
    }
    const thread = S.threads[entry.thread] || threadSeed[entry.thread];
    return sheet(entry.name, `<div class="listing">${bot('other')}<div><p>${entry.desc}</p><p class="fine">Assistant · Owned by ${entry.owner} · Verified home: ${entry.origin}</p></div></div>${routes}
      <div class="sec" style="margin:16px 0 6px">Public actions</div>${thread.catalog.map(([name, desc]) => `<div class="work"><div><strong>${name}</strong><small>${desc}</small></div></div>`).join('')}
      <p class="fine" style="margin-top:10px">${entry.owner.split(' ')[0]}’s instructions decide what it does for you. It may need ${entry.owner.split(' ')[0]}’s approval first.</p>`,
      `<button data-act="overlay" data-type="invite" data-who="${entry.name}" data-assistant-invite="${entry.owner}">Invite to a group</button><button class="primary" data-act="startThread" data-v="${entry.thread}">Start a request</button>`);
  },
  newGroup() {
    const companion = S.defaultAssistant && MY_ASSISTANTS[S.defaultAssistant];
    return sheet('New group', `<form id="new-group" data-submit="newGroup">
      <label class="field">Group name<input name="name" required maxlength="60" placeholder="Vendor review" autocomplete="off"></label>
      <label class="field">Relay<select name="relay"><option>Team</option><option>Home</option><option>Partners</option></select><small>A group lives on one relay. Your machine hosts it, so messages reach people only while it’s online.</small></label>
      <div class="notice plain">${companion ? bot(MY_ASSISTANTS[S.defaultAssistant].cls) : ic('info')}<span>${companion ? `<strong>${companion.name} joins with you.</strong> Everyone in the group can see it.` : 'You have no default assistant, so only you join.'} <button type="button" class="link" data-act="open" data-screen="you">Change</button></span></div>
      <p class="label">Invite now</p>${['Noa Levi', 'Dan Cohen'].map(name => `<label class="op"><input type="checkbox" name="invite" value="${name}"><span>${name}</span></label>`).join('')}</form>`,
      `<button data-act="closeOverlay">Cancel</button><button class="primary" type="submit" form="new-group">Create group</button>`);
  },
  invite({ who, assistantInvite }) {
    const groups = Object.entries(S.groups);
    const options = who ? [[who, assistantInvite]] : [['Maya Shalev', ''], ['Calendar helper', 'Maya Shalev'], ['Research scout', 'Dan Cohen']];
    return sheet('Invite to a group', `<form id="invite-form" data-submit="invite">
      <label class="field">Group<select name="group">${groups.map(([id, group]) => `<option value="${id}" ${id === S.group ? 'selected' : ''}>${esc(group.name)} (${group.relay})</option>`).join('')}</select></label>
      <p class="label">Who</p>${options.map(([name, owner], index) => `<label class="op"><input type="radio" name="who" value="${name}" ${index === 0 ? 'checked' : ''}><span>${name}<small>${owner ? `${owner.split(' ')[0]} must approve. ${owner.split(' ')[0]} doesn’t join the group.` : `Can accept or decline. If accepted, their default assistant joins too.`}</small></span></label>`).join('')}
      <p class="fine" style="margin-top:10px">They see messages from when they join, not earlier ones.</p></form>`,
      `<button data-act="closeOverlay">Cancel</button><button class="primary" type="submit" form="invite-form">Send invitation</button>`);
  },
  leave() {

  if (field.dataset.op) {
    const action = selectedAction();
    action.ops = field.checked ? [...action.ops, field.dataset.op] : action.ops.filter(op => op !== field.dataset.op);
    render();
  }
  if (field.dataset.bind) S[field.dataset.bind] = field.value;
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && S.overlay) { S.overlay = null; render(); }
  if (event.key === 'Enter' && !event.shiftKey && event.target.matches('.composer textarea')) { event.preventDefault(); event.target.form.requestSubmit(); }
});
render();
</script>
</body>
