name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Read release version
        id: version
        run: |
          node scripts/prepare-release.mjs --metadata-only
      # Skips the test suite for a version that is already published; the release job checks again under its lock.
      - name: Decide whether to publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/prepare-release.mjs

  test:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # A newer push replaces this run's tests instead of queueing a second full suite behind them.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - run: npm ci
      - run: npm run typecheck
      - name: Install native synchronization test dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends syncthing
      # The agent CLIs under bin/ run from dist, and tests run them.
      - run: npm run build
      - name: Run test suite
        timeout-minutes: 30
        run: node scripts/ci-test.mjs

  release:
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-${{ needs.version.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          registry-url: https://registry.npmjs.org
      - name: Validate release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/prepare-release.mjs
      # Packing builds dist (prepack), which needs the dev dependencies.
      - run: npm ci
        if: steps.release.outputs.publish == 'true'
      - name: Pack and smoke test
        if: steps.release.outputs.publish == 'true'
        run: |
          printf 'commit=%s\n' "$GITHUB_SHA" > .joint-bob-release
          package=$(npm pack --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].filename))')
          mv "$package" joint-bob.tar.gz
          tar -tzf joint-bob.tar.gz | grep -q 'package/bin/joint-bob.mjs'
          tar -xOf joint-bob.tar.gz package/.joint-bob-release | grep -qx "commit=$GITHUB_SHA"
          sha256sum joint-bob.tar.gz > joint-bob.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        if: steps.release.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Joint Bob ${{ steps.release.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: legacy
          generate_release_notes: true
          files: |
            joint-bob.tar.gz
            joint-bob.tar.gz.sha256
      - name: Publish to npm when configured
        if: steps.release.outputs.publish == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
        run: |
          npm install --global npm@11
          npm publish --provenance --access public
