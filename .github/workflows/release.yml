name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Read release version
        id: version
        run: |
          node scripts/prepare-release.mjs --metadata-only
      # Published tags skip redundant tests; main pushes run fast checks unless publishing.
      - name: Decide whether to publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/prepare-release.mjs

  test:
    needs: version
    if: github.ref == 'refs/heads/main' || needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    name: test (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Each shard cancels only its predecessor when a newer commit arrives.
    concurrency:
      group: test-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    env:
      TEST_SHARD_INDEX: ${{ matrix.shard }}
      TEST_SHARD_COUNT: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - name: Reject private dependency URLs before installation
        run: node scripts/check-public-dependencies.mjs package-lock.json npm-shrinkwrap.json
      - run: npm ci
      - name: Typecheck
        if: matrix.shard == 1
        run: npm run typecheck
      - name: Install native synchronization test dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends syncthing
      # The agent CLIs under bin/ run from dist, and tests run them.
      - run: npm run build
      - name: Run fast test suite
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.publish != 'true'
        timeout-minutes: 30
        env:
          FILE_SYNC_SEEDS: 40
        run: node scripts/ci-test.mjs
      - name: Run full test suite
        if: github.event_name != 'push' || github.ref != 'refs/heads/main' || needs.version.outputs.publish == 'true'
        timeout-minutes: 30
        run: node scripts/ci-test.mjs

  release:
    needs: [version, test]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-${{ needs.version.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - name: Validate release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/prepare-release.mjs
      - name: Reject private dependency URLs before packing
        if: steps.release.outputs.publish == 'true'
        run: node scripts/check-public-dependencies.mjs package-lock.json npm-shrinkwrap.json
      # Packing builds dist (prepack), which needs the dev dependencies.
      - run: npm ci
        if: steps.release.outputs.publish == 'true'
      - name: Pack and smoke test
        if: steps.release.outputs.publish == 'true'
        run: |
          printf 'commit=%s\n' "$GITHUB_SHA" > .joint-bob-release
          package=$(npm pack --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].filename))')
          mv "$package" joint-bob.tar.gz
          tar -tzf joint-bob.tar.gz | grep -q 'package/bin/joint-bob.mjs'
          tar -xOf joint-bob.tar.gz package/.joint-bob-release | grep -qx "commit=$GITHUB_SHA"
          sha256sum joint-bob.tar.gz > joint-bob.tar.gz.sha256
          # Verify the actual shipped lockfile, then install with no credentials or warm cache.
          smoke=$(mktemp -d)
          trap 'rm -rf "$smoke"' EXIT
          tar -xzf joint-bob.tar.gz -C "$smoke"
          node scripts/check-public-dependencies.mjs "$smoke/package/npm-shrinkwrap.json"
          mkdir "$smoke/home"
          touch "$smoke/user.npmrc" "$smoke/global.npmrc"
          cd "$smoke/package"
          env -i PATH="$PATH" HOME="$smoke/home" \
            NPM_CONFIG_USERCONFIG="$smoke/user.npmrc" NPM_CONFIG_GLOBALCONFIG="$smoke/global.npmrc" \
            NPM_CONFIG_CACHE="$smoke/cache" \
            npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - uses: softprops/action-gh-release@v2
        if: steps.release.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Joint Bob ${{ steps.release.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: legacy
          generate_release_notes: true
          files: |
            joint-bob.tar.gz
            joint-bob.tar.gz.sha256
      - name: Publish to npm when configured
        if: steps.release.outputs.publish == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
        run: |
          npm install --global npm@11
          npm publish --provenance --access public
